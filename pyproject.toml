[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recode-detector"
dynamic = ["version"]
description = "Local, offline protein-level proteomics analysis: QC, normalisation, imputation, differential abundance, enrichment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "openpyxl>=3.1", "reportlab>=4.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
recode-detector = "recode_detector.server:main"

[tool.setuptools.dynamic]
version = { attr = "recode_detector.__version__" }

[tool.setuptools.packages.find]
include = ["recode_detector*"]

[tool.setuptools.package-data]
recode_detector = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
